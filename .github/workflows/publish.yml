name: Publier @somtech-solutions/pack (GitHub Packages)

# Publie le CLI sur GitHub Packages à chaque tag vX.Y.Z.
# Prérequis (action Maxime, une fois) :
#   - Le scope @somtech-solutions doit pointer vers une org GitHub où ce repo
#     peut publier. Si l'org diffère du owner du repo, fournir un PAT
#     `PACKAGES_TOKEN` (write:packages) dans les secrets du repo.
#   - Sinon, GITHUB_TOKEN suffit (package owned par le owner du repo).
#
# La chaîne tourne AUSSI à blanc, hors tag (PR touchant ce qui est publié, ou
# déclenchement manuel) : mêmes étapes, `npm publish --dry-run` au lieu du vrai.
# Sans ça, la publication n'était éprouvée qu'au moment où on taguait — et un
# tag ne se rejoue pas. C'est ce qui a laissé v1.29.1 partir vers un échec que
# rien n'avait pu voir venir. Seul un tag poussé atteint le registre (l'étape
# « Publier » est gardée là-dessus, et un test le vérifie).
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/publish.yml'
      - 'cli/**'
      - 'ligne-directe/**'
      - 'naissance-representant/**'
      - 'herdr-plugins/excalidraw/**'
      - 'pack.json'
      - 'VERSION'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # SEUL un tag poussé publie pour de vrai. PR et déclenchement manuel
      # rejouent la même chaîne à blanc — rien n'atteint le registre.
      RELEASE: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v4

      - name: Préflight — cohérence scope / owner / token
        env:
          SCOPE: '@somtech-solutions'
          OWNER: ${{ github.repository_owner }}
          HAS_PAT: ${{ secrets.PACKAGES_TOKEN != '' }}
        run: |
          # GitHub Packages exige scope == login du owner, sauf PAT cross-org.
          scope_name="${SCOPE#@}"
          owner_lc="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          if [ "$scope_name" != "$owner_lc" ] && [ "$HAS_PAT" != "true" ]; then
            echo "✗ Scope $SCOPE ≠ owner @$owner_lc et aucun secret PACKAGES_TOKEN."
            echo "  Publish GitHub Packages impossible. Choisis :"
            echo "   (a) créer/utiliser l'org GitHub '$scope_name' + ajouter le secret PACKAGES_TOKEN (write:packages), ou"
            echo "   (b) aligner le scope du package sur @$owner_lc."
            exit 1
          fi
          echo "✓ Préflight OK (scope=$SCOPE, owner=@$owner_lc, PAT=$HAS_PAT)"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@somtech-solutions'

      # Le tag git est la SOURCE UNIQUE de version. On aligne VERSION + pack.json
      # AVANT de construire le payload pour que le contenu bundlé porte la bonne
      # version (fin du drift : plus aucun alignement manuel à oublier dans le repo).
      # Hors tag, il n'y a pas de version à aligner : le VERSION du repo fait foi,
      # et le garde-fou version-consistency.test.js le tient déjà cohérent.
      - name: Aligner VERSION + pack.json sur le tag (source unique)
        if: env.RELEASE == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"
          # Valider le format semver AVANT usage (anti-injection : TAG est un nom de tag).
          if ! printf '%s' "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
            echo "✗ Tag non semver : $TAG"; exit 1
          fi
          printf '%s\n' "$VER" > VERSION
          VER="$VER" node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('pack.json','utf8'));p.version=process.env.VER;fs.writeFileSync('pack.json',JSON.stringify(p,null,2)+'\n')"
          echo "✓ VERSION et pack.json alignés sur $VER"

      # Le canvas est embarqué CONSTRUIT dans le paquet : sa page et les dépendances
      # d'exécution de son serveur ne sont pas versionnées, elles se produisent ici.
      # Sans cette étape, le paquet promet un canvas qu'il ne livre pas.
      # Décision : docs/superpowers/specs/2026-07-24-distribution-canvas-decision.md
      - name: Construire le canvas (page + dépendances d'exécution du serveur)
        run: bash scripts/build.sh
        working-directory: herdr-plugins/excalidraw

      - name: Construire le payload (depuis le repo, anti-drift)
        run: node scripts/build-payload.mjs
        working-directory: cli

      - name: Aligner la version du CLI sur le tag
        if: env.RELEASE == 'true'
        working-directory: cli
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"
          # Valider le format semver AVANT usage (anti-injection : TAG est un nom de tag).
          if ! printf '%s' "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
            echo "✗ Tag non semver : $TAG"; exit 1
          fi
          npm version "$VER" --no-git-tag-version --allow-same-version

      # Passer par `npm test` (et pas `node --test`) : la portée vient du
      # package.json du CLI, qui borne la découverte à cli/test/. Sans ce
      # bornage, l'étape précédente vient de construire cli/payload/ — une COPIE
      # de ligne-directe, qui exige Node 22 — et sa suite s'exécuterait ici en
      # Node 20. C'est ce qui a fait échouer la publication de v1.29.1.
      # ⚠️ La même suite tourne dans DEUX chaînes (ici et `tests.yml`), et ce qu'elle exige
      # doit être posé dans les deux. Les contrôles de T-20260819-0013 lancent un `zsh -c` :
      # sans zsh, ils échouent — franchement, pas en silence — et la publication rougit sur
      # un défaut qui n'est pas le sien. Armer une chaîne sur deux, c'est le défaut que ce
      # dépôt paie régulièrement.
      - name: Installer zsh (contrôle du PATH depuis un shell non interactif)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Tests
        run: npm test
        working-directory: cli

      # À blanc : npm fait tout le travail de publication — prepublishOnly
      # (reconstruction du payload), empaquetage, inventaire du tarball — et
      # s'arrête avant d'écrire au registre. C'est ce qui rend la chaîne
      # vérifiable sans brûler un tag.
      - name: Publier à blanc (hors tag — rien n'atteint le registre)
        if: env.RELEASE != 'true'
        working-directory: cli
        run: npm publish --dry-run

      - name: Publier
        if: env.RELEASE == 'true'
        working-directory: cli
        run: npm publish
        env:
          # PAT prioritaire (publish cross-org) ; sinon GITHUB_TOKEN du repo.
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
