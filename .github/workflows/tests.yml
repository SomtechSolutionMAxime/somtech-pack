name: tests

# Exécute la suite de tests shell du pack (scripts/tests/*.sh) sur chaque PR
# et push vers main. Comble le gap relevé en code review (T-20260625-0013 /
# -0014) : les lints de garde (secrets en clair, installateur claude-swt) ne
# tournaient nulle part → garde-fous inertes.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exécuter scripts/tests/*.sh
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail=0
          tests=(scripts/tests/*.sh)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "Aucun test shell trouvé sous scripts/tests/"; exit 1
          fi
          for t in "${tests[@]}"; do
            echo "::group::$t"
            if bash "$t"; then echo "✓ $t"; else echo "✗ $t"; fail=1; fi
            echo "::endgroup::"
          done
          exit "$fail"

  cli-tests:
    # Suite unitaire du CLI (node --test), dont le parser BRD déterministe (parité, mutation,
    # écriture ciblée). Zéro dépendance : aucun `npm install` requis. Comble le gap où ces tests
    # ne tournaient qu'au publish (D-20260710-0009).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # `npm test` et non `node --test` : une seule source de vérité pour la
      # portée de la suite (le package.json du CLI, borné à cli/test/).
      - name: node --test (cli)
        run: npm test
        working-directory: cli

  ligne-directe-tests:
    # Suite de la ligne directe (node --test). Job DISTINCT de `cli-tests`, et ce n'est pas
    # un doublon : `ligne-directe/` déclare `engines.node >= 22` parce que le veilleur tient
    # son écoute avec le WebSocket natif, absent avant Node 22. L'étendre à `cli-tests`
    # (Node 20) ferait tomber la moitié de la suite sur une erreur de référence.
    #
    # Sans ce job, les 76 tests qui prouvent les garanties les plus coûteuses de la ligne
    # directe — la remise qui échoue bruyamment, la ligne close qui répond, l'agent disparu
    # dont la ligne se referme — ne s'exécutaient nulle part (T-20260806-0014). RA-DIS-004 :
    # une preuve que personne n'exécute n'est pas une preuve.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --test (ligne-directe)
        run: npm test
        working-directory: ligne-directe

  python-tests:
    # Loader NetworkX du graphe BRD (aims/brd-graph). Le reste du CI est Node-only ; ce job
    # installe networkx + pytest pour tester le loader (Epic F, D-20260710-0009).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: pip install -r requirements.txt
        working-directory: aims/brd-graph
      - name: pytest (aims/brd-graph)
        run: python -m pytest -q
        working-directory: aims/brd-graph
